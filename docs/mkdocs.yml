site_name: Hisaab Docs
site_description: Personal finance and net worth tracker, SMS-first.
docs_dir: content

theme:
  name: material
  features:
    - navigation.sections
    - search.suggest
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Switch to light mode }

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture: architecture.md
