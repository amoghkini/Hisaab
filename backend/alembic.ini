# Used by the alembic command line (e.g. `uv run alembic revision --autogenerate --rev-id 0012 -m "..."`).
# The app itself runs migrations on startup (app/migrate.py), with the URL from HISAAB_DATABASE_URL.
[alembic]
script_location = migrations
# So migrations/env.py can import the app's models when run from the command line.
prepend_sys_path = .

# Generated revisions are formatted and linted like the rest of the code, so nobody has to touch them.
[post_write_hooks]
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --select I,F401 REVISION_SCRIPT_FILENAME
