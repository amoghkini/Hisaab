[project]
name = "hisaab-backend"
version = "0.1.0"
description = "Hisaab API: auth, SMS pipeline and ledger"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
    "alembic>=1.20.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
